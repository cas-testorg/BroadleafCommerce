name: CI

on:
  pull_request:
  push:

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build with Maven
        id: build
        continue-on-error: true
        run: |
          ./mvnw clean test 2>&1 | tee build.log

      - name: Upload build log
        if: steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Create issue on build failure
        if: steps.build.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const log = fs.readFileSync('build.log', 'utf8');
            const trimmedLog = log.slice(-12000);

            const title = `CI failure: ${context.workflow} #${context.runNumber}`;

            const body = `
            Build failed in workflow: ${context.workflow}

            Run:
            ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}

            Ref:
            ${context.ref}

            SHA:
            ${context.sha}

            Suggested CoreStory workflow:
            Use the Agentic Bug Resolution playbook against this issue. Treat the build failure as the bug report. First identify affected modules, likely dependency or code paths, then reproduce with the smallest test/build command before changing code.

            Failure log excerpt:

            \`\`\`
            ${trimmedLog}
            \`\`\`
            `;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['ci-failure', 'corestory-investigation']
            });

            core.setFailed('Build failed');
